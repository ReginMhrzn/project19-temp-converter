<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #fae9d9, #f7d8c4);
            background-attachment: fixed;
            padding: 1.5rem;
        }

        .card {
            max-width: 680px;
            width: 100%;
            background: linear-gradient(135deg, #fcefe2, #fbebd8);
            border-radius: 3.5rem 1.5rem 3.5rem 1.5rem;
            box-shadow: 0 20px 40px -12px rgba(120, 70, 40, 0.35),
                inset 0 1px 2px rgba(255, 245, 230, 0.8);
            padding: 2.8rem 2.8rem 2.5rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(230, 180, 140, 0.4);
            backdrop-filter: blur(2px);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .header i {
            font-size: 2.6rem;
            color: #b86f3a;
            filter: drop-shadow(0 2px 8px rgba(180, 100, 40, 0.25));
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #482f1e;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            font-weight: 300;
            color: #7a5c45;
            font-size: 1.2rem;
            margin-left: 0.3rem;
        }

        .converter-grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            margin-top: 0.5rem;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem 0.8rem;
            background: rgba(245, 225, 210, 0.4);
            padding: 1rem 1.2rem;
            border-radius: 2.5rem;
            border: 1px solid #e7cdbb;
            backdrop-filter: blur(2px);
        }

        .input-group label {
            font-weight: 500;
            color: #5f3f2b;
            min-width: 70px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
        }

        .input-group label i {
            color: #b86f3a;
            width: 1.4rem;
            font-size: 1.1rem;
        }

        .input-group input {
            flex: 1;
            min-width: 150px;
            padding: 0.7rem 1.2rem;
            border: 1px solid #dbbaaa;
            border-radius: 60px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            background: #fcf3ea;
            color: #2d1f12;
            outline: none;
            transition: 0.2s;
            box-shadow: inset 0 2px 6px rgba(150, 100, 60, 0.08);
        }

        .input-group input:focus {
            border-color: #c58f66;
            background: #fffaf5;
            box-shadow: 0 0 0 3px rgba(200, 140, 100, 0.2);
        }

        .input-group input::placeholder {
            color: #b3947c;
            font-weight: 300;
            font-size: 0.9rem;
        }

        .swap-wrap {
            display: flex;
            justify-content: center;
            margin: 0.2rem 0 0.2rem;
        }

        .btn-swap {
            background: #eedbcb;
            border: 1px solid #dbbcac;
            color: #4d3424;
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            box-shadow: 0 4px 10px rgba(140, 90, 50, 0.12), inset 0 1px 0 rgba(255, 235, 210, 0.7);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-swap i {
            color: #9b673d;
            font-size: 1.1rem;
        }

        .btn-swap:hover {
            background: #f5e1d1;
            transform: scale(1.02);
            border-color: #c9a086;
            box-shadow: 0 8px 16px rgba(130, 80, 45, 0.2);
        }

        .btn-swap:active {
            transform: scale(0.96);
        }

        .result-box {
            background: #f3ddd0;
            border-radius: 2.5rem;
            padding: 1rem 1.8rem;
            border: 1px solid #e7cbb8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem 1.2rem;
            margin-top: 0.4rem;
            box-shadow: inset 0 2px 6px rgba(150, 100, 60, 0.06);
        }

        .result-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 500;
            color: #5f3f2b;
        }

        .result-label i {
            color: #b86f3a;
            font-size: 1.3rem;
        }

        .result-value {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2d1f12;
            letter-spacing: 0.3px;
            background: #fcf3ea;
            padding: 0.2rem 1.8rem;
            border-radius: 60px;
            border: 1px solid #dbbaaa;
            min-width: 110px;
            text-align: center;
            font-family: 'Poppins', sans-serif;
        }

        .result-value small {
            font-weight: 300;
            font-size: 1rem;
            color: #7a5c45;
            margin-left: 0.3rem;
        }

        @media (max-width: 550px) {
            .card {
                padding: 1.8rem 1.2rem;
                border-radius: 2.5rem 1rem 2.5rem 1rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .header i {
                font-size: 2rem;
            }
            .input-group {
                padding: 0.8rem 1rem;
                border-radius: 2rem;
                flex-direction: column;
                align-items: stretch;
            }
            .input-group label {
                min-width: auto;
            }
            .input-group input {
                min-width: auto;
                width: 100%;
            }
            .result-box {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .result-value {
                font-size: 1.5rem;
                min-width: auto;
                padding: 0.3rem 1rem;
            }
            .btn-swap {
                padding: 0.5rem 1.4rem;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <i class="fas fa-temperature-high"></i>
            <h1>Temperature Converter</h1>
        </div>

        <div class="converter-grid">
            <div class="input-group" id="celsiusGroup">
                <label for="celsiusInput"><i class="fas fa-thermometer-half"></i> Celsius</label>
                <input type="number" id="celsiusInput" placeholder="e.g. 25" step="any" value="25">
            </div>

            <div class="swap-wrap">
                <button class="btn-swap" id="swapBtn">
                    <i class="fas fa-arrow-up-arrow-down"></i> Swap units
                </button>
            </div>

            <div class="input-group" id="fahrenheitGroup">
                <label for="fahrenheitInput"><i class="fas fa-thermometer-full"></i> Fahrenheit</label>
                <input type="number" id="fahrenheitInput" placeholder="e.g. 77" step="any" value="77">
            </div>

            <div class="result-box" id="resultBox">
                <span class="result-label">
                    <i class="fas fa-check-circle"></i> Converted
                </span>
                <span class="result-value" id="resultDisplay">
                    25 <small>°C</small>
                </span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const celsiusInput = document.getElementById('celsiusInput');
            const fahrenheitInput = document.getElementById('fahrenheitInput');
            const resultDisplay = document.getElementById('resultDisplay');
            const swapBtn = document.getElementById('swapBtn');

            function updateResult() {
                const cVal = parseFloat(celsiusInput.value);
                const fVal = parseFloat(fahrenheitInput.value);

                if (document.activeElement === fahrenheitInput) {
                    if (!isNaN(fVal)) {
                        const c = (fVal - 32) * 5 / 9;
                        celsiusInput.value = c.toFixed(2);
                        resultDisplay.innerHTML = `${c.toFixed(2)} <small>°C</small>`;
                    } else {
                        resultDisplay.innerHTML = `0 <small>°C</small>`;
                    }
                } else {
                    if (!isNaN(cVal)) {
                        const f = (cVal * 9 / 5) + 32;
                        fahrenheitInput.value = f.toFixed(2);
                        resultDisplay.innerHTML = `${f.toFixed(2)} <small>°F</small>`;
                    } else if (!isNaN(fVal)) {
                        const c = (fVal - 32) * 5 / 9;
                        celsiusInput.value = c.toFixed(2);
                        resultDisplay.innerHTML = `${c.toFixed(2)} <small>°C</small>`;
                    } else {
                        resultDisplay.innerHTML = `0 <small>°C</small>`;
                    }
                }
            }

            celsiusInput.addEventListener('input', updateResult);
            fahrenheitInput.addEventListener('input', updateResult);
            celsiusInput.addEventListener('blur', updateResult);
            fahrenheitInput.addEventListener('blur', updateResult);

            swapBtn.addEventListener('click', function() {
                const cVal = parseFloat(celsiusInput.value);
                const fVal = parseFloat(fahrenheitInput.value);

                if (!isNaN(cVal) && !isNaN(fVal)) {
                    celsiusInput.value = fVal.toFixed(2);
                    fahrenheitInput.value = cVal.toFixed(2);
                } else if (!isNaN(cVal)) {
                    const f = (cVal * 9 / 5) + 32;
                    celsiusInput.value = f.toFixed(2);
                    fahrenheitInput.value = cVal.toFixed(2);
                } else if (!isNaN(fVal)) {
                    const c = (fVal - 32) * 5 / 9;
                    fahrenheitInput.value = c.toFixed(2);
                    celsiusInput.value = fVal.toFixed(2);
                } else {
                    celsiusInput.value = '25';
                    fahrenheitInput.value = '77';
                }
                updateResult();
                celsiusInput.focus();
            });

            if (celsiusInput.value === '') celsiusInput.value = '25';
            if (fahrenheitInput.value === '') fahrenheitInput.value = '77';
            updateResult();
        })();
    </script>
</body>
</html>
